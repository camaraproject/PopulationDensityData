    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip

  x-camara-commonalities: 0.9.0
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/PopulationDensityData

servers:
  - url: '{apiRoot}/population-density-data/vwip'

    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Population Density Data
    description: Operations to retrieve population density information.
paths:
  /retrieve:
    post:
      tags:
        - Population Density Data
      summary: Retrieves population density information in a specified area
      description: >-
        Retrieves population density estimations for a specified area (polygon or geohash list)
        and time interval. The response is a sequence of hourly time slots, each containing
        estimated population density data for the grid cells covering the requested area.
      operationId: retrievePopulationDensity
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PopulationDensityRequest'
            example:
              area:
                areaType: POLYGON
                boundary:
                  - latitude: 45.754114
                    longitude: 4.860374
                  - latitude: 45.753845
                    longitude: 4.863185
                  - latitude: 45.75249
                    longitude: 4.861876
                  - latitude: 45.751224
                    longitude: 4.861125
                  - latitude: 45.751442
                    longitude: 4.859827
              startTime: '2024-04-23T14:44:18.165Z'
              endTime: '2024-04-23T14:44:18.165Z'
              precision: 7
        required: true
      callbacks:
        populationDensityDataCallback:
          '{$request.body#/sink}':
            post:
              tags:
                - Population Density Data
              summary: 'Population Density Data callback'
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                The Population Density Data server will call this endpoint when the request result is ready.
              operationId: postNotification
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                description: Population density data result.
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PopulationDensityAsyncResponse'
                    examples:
                      PopulationDensitySupportedAreaAsyncResponseExample:
                        $ref: '#/components/examples/PopulationDensitySupportedAreaAsyncResponseExample'
                      PopulationDensityAreaNotSupportedAsyncResponseExample:
                        $ref: '#/components/examples/PopulationDensityAreaNotSupportedAsyncResponseExample'
                      PopulationDensityPartOfAreaNotSupportedAsyncResponseExample:
                        $ref: '#/components/examples/PopulationDensityPartOfAreaNotSupportedAsyncResponseExample'
                      PopulationDensityOperationNotCompletedExample:
                        $ref: '#/components/examples/PopulationDensityOperationNotCompletedExample'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                '400':
                  $ref: '../common/CAMARA_common.yaml#/components/responses/BadRequest400'
                '401':
                  $ref: '../common/CAMARA_common.yaml#/components/responses/Unauthenticated401'
                '403':
                  $ref: '../common/CAMARA_common.yaml#/components/responses/PermissionDenied403'
                '410':
                  $ref: '../common/CAMARA_event_common.yaml#/components/responses/SinkGone410'
                '429':
                  $ref: '../common/CAMARA_common.yaml#/components/responses/TooManyRequests429'
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        '200':
          description: Population density data result.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopulationDensityResponse'
              examples:
                PopulationDensitySupportedAreaResponseExample:
                  $ref: '#/components/examples/PopulationDensitySupportedAreaResponseExample'
                PopulationDensityAreaNotSupportedResponseExample:
                  $ref: '#/components/examples/PopulationDensityAreaNotSupportedResponseExample'
                PopulationDensityPartOfAreaNotSupportedResponseExample:
                  $ref: '#/components/examples/PopulationDensityPartOfAreaNotSupportedResponseExample'

        '202':
          description: Population density data requested. This response is returned when the behaviour of the API is asynchronous.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedAsyncResponse'
        '400':
          $ref: '#/components/responses/RetrieveLocationBadRequest400'
        '401':
          $ref: '../common/CAMARA_common.yaml#/components/responses/Unauthenticated401'
        '403':
          $ref: '../common/CAMARA_common.yaml#/components/responses/PermissionDenied403'
        '422':
          $ref: '#/components/responses/RetrieveLocationUnprocessableContent422'
        '429':
          $ref: '../common/CAMARA_common.yaml#/components/responses/TooManyRequests429'
      security:
        - openId:
            - population-density-data:read
components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"
  schemas:
    PopulationDensityRequest:
      type: object
      description: >-
        Request object for retrieving population density data in a
        specified area.
        **NOTE**: The difference between `startTime` and `endTime` cannot be greater than 7 days.
      additionalProperties: false
      properties:
        area:
          $ref: '#/components/schemas/Area'
        startTime:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        endTime:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        precision:
          type: integer
          format: int32
          description: >-
            Precision required of response cells. Precision defines a geohash level and corresponds to the length of the geohash for each cell. More information at [Geohash system](https://en.wikipedia.org/wiki/Geohash).
            When `area.areaType` is `POLYGON`, if not included the default precision level 7 is used.
            Values within the schema range (1–12) that are not supported by the MNO return the error response `422 POPULATION_DENSITY_DATA.UNSUPPORTED_PRECISION`. Values outside the schema range are invalid per the OpenAPI definition and return `400 INVALID_ARGUMENT` via request validation.
            This property MUST only be set when `area.areaType` is `POLYGON`. When `area.areaType` is `GEOHASHLIST`, each requested geohash determines the granularity of its own response cell; if `precision` is sent, the API returns a `400 INVALID_ARGUMENT` error.
          minimum: 1
          maximum: 12
          default: 7
        sink:
          description: |
            The address where the API response will be asynchronously delivered, using the HTTP protocol.
            Providing `sink` enforces the asynchronous behaviour of the API. If the API provider does not
            support asynchronous processing, the request MUST be rejected with the error response
            `422 POPULATION_DENSITY_DATA.UNSUPPORTED_ASYNC_RESPONSE` and no callback is delivered.
            The API consumer can then retry the request without `sink` to obtain a synchronous response.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
      required:
        - area
        - startTime
        - endTime
    Area:
      description: Base schema for all areas
      type: object
      properties:
        areaType:
          $ref: "#/components/schemas/AreaType"
      required:
        - areaType
      discriminator:
        propertyName: areaType
        mapping:
          POLYGON: "#/components/schemas/Polygon"
          GEOHASHLIST: "#/components/schemas/GeohashList"
    AreaType:
      type: string
      description: |
        Type of this area.
        POLYGON - The area is defined as a polygon.
        GEOHASHLIST - The area is defined as a list of geohashes.
      enum:
        - POLYGON
        - GEOHASHLIST
    Polygon:
      description: Polygonal area. The Polygon should be a simple polygon, i.e. should not intersect itself.
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            - boundary
          properties:
            boundary:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/PointList"
    GeohashList:
      description: >-
        Area defined as a list of geohashes. Geohashes do not need to be adjacent or contiguous and may have different precision levels (string lengths), as long as the MNO supports all of them. The `precision` request property MUST NOT be set when `areaType` is `GEOHASHLIST`; if set, the API returns a `400 INVALID_ARGUMENT` error.
      allOf:
        - $ref: "#/components/schemas/Area"
        - type: object
          required:
            - geohashes
          properties:
            geohashes:
              type: array
              description: List of geohashes that define the area of interest.
              minItems: 1
              maxItems: 1000
              items:
                $ref: "#/components/schemas/Geohash"
    Geohash:
      type: string
      description: >-
        Geohash string identifying a cell using the [Geohash system](https://en.wikipedia.org/wiki/Geohash),
        encoding a geographic location into a short string. Characters are taken from the
        base-32 geohash alphabet (`0-9` and `b-z` excluding `a`, `i`, `l`, `o`).
        The length of the string determines the cell granularity (precision).
      pattern: ^[0-9bcdefghjkmnpqrstuvwxyz]{1,12}$
      maxLength: 12
      example: ezdmemd
    PopulationDensityResponse:
      type: object
      description: >-
        Population density data represented as hourly time intervals for the
        cells of the requested area. Each element in `timedPopulationDensityData` array corresponds
        to a one-hour time interval, containing population density data for the grid cells.
      properties:
        timedPopulationDensityData:
          type: array
          description: >-
            Time ranges along with the population density data for the cells within it.
             The request startTime or the request endTime have to be fully covered by the intervals.
             For example, if the intervals are 1-hour long and the input date range were [2024-01-03T11:25:00Z
             to 2024-01-03T12:45:00Z] it would contain 2 intervals (Interval from 2024-01-03T11:00:00Z
             to 2024-01-03T12:00:00Z and interval from 2024-01-03T12:00:00Z to 2024-01-03T13:00:00Z).
          items:
            $ref: '#/components/schemas/TimedPopulationDensityData'
          maxItems: 168
        status:
          $ref: '#/components/schemas/ResponseStatus'
        statusInfo:
          type: string
          maxLength: 512
          description: Information about the status, mandatory when property `status` is `OPERATION_NOT_COMPLETED` for adding extra information about the error.
          example: Some error happened during the processing of the request
      required:
        - timedPopulationDensityData
        - status
    AcceptedAsyncResponse:
      type: object
      description: Accepted asynchronous response
      properties:
        operationId:
          $ref: '#/components/schemas/OperationId'
      required:
        - operationId
    PopulationDensityAsyncResponse:
      description: Asynchronous population density data response
      allOf:
        - $ref: '#/components/schemas/PopulationDensityResponse'
        - type: object
          properties:
            operationId:
              $ref: '#/components/schemas/OperationId'
          required:
            - operationId
    OperationId:
      type: string
      maxLength: 256
      description: The unique identifier of the asynchronous operation that is returned when the operation is initiated.
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{1,256}$
      example: 2322f362-eaab-4cf3-86d2-efcbdf3a7cb4
    ResponseStatus:
      type: string
      description: >-
        Represents the state of the response for the input area defined in the request, the possible values are:
          - `SUPPORTED_AREA`: The whole request area is supported. Population density data for the entire requested area is returned.
          - `PART_OF_AREA_NOT_SUPPORTED`: Part of the requested area is outside the MNOs coverage area, the cells outside the coverage
          area will have property `dataType` with value `NO_DATA`.
          - `AREA_NOT_SUPPORTED`: The whole requested area is outside the MNOs coverage area. No data will be returned.
          - `OPERATION_NOT_COMPLETED`: An error happened during asynchronous processing of the request. This status will only be returned
          in case the asynchronous API behaviour is used.
      enum:
        - SUPPORTED_AREA
        - PART_OF_AREA_NOT_SUPPORTED
        - AREA_NOT_SUPPORTED
        - OPERATION_NOT_COMPLETED
    TimedPopulationDensityData:
      type: object
      description: >-
        Population density data for a concrete time interval. It contains the start and end time of the
        interval and the population density data of each grid cell of the requested area within it.
      properties:
        startTime:
          description: Interval start time.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
            - example: "2023-07-03T10:00:00Z"
        endTime:
          description: Interval end time.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
            - example: "2023-07-03T11:00:00Z"
        cellPopulationDensityData:
          $ref: '#/components/schemas/CellPopulationDensityDataArray'
      required:
        - startTime
        - endTime
        - cellPopulationDensityData
    CellPopulationDensityDataArray:
      type: array
      description: >-
        Population density data for the different cells in a concrete time range.
      items:
        $ref: '#/components/schemas/CellPopulationDensityData'
      minItems: 1
      maxItems: 10000
    CellPopulationDensityData:
      type: object
      description: >-
        Population density data of a cell in a concrete time range. In case of
        insufficient data, to guarantee an anonymized prediction due to the
        k-anonymity within a specific cell and time range, no population density
        data is returned and the property `dataType` value is "LOW_DENSITY". In
        case of a cell not supported `dataType` value is "NO_DATA"
      properties:
        geohash:
          $ref: '#/components/schemas/Geohash'
        dataType:
          type: string
          description: |
            Type of population density data returned for the cell, the possible values are:
              - `DENSITY_ESTIMATION`: The population density estimation is returned for the cell.
              - `LOW_DENSITY`: The data related to the cell is not sufficient to guarantee k-anonymity, so no population density estimation is returned.
              - `NO_DATA`: The cell is outside the MNO coverage area, so no population density data is returned.
          enum:
            - NO_DATA
            - LOW_DENSITY
            - DENSITY_ESTIMATION
      required:
        - geohash
        - dataType
      discriminator:
        propertyName: dataType
        mapping:
          NO_DATA: '#/components/schemas/NoData'
          LOW_DENSITY: '#/components/schemas/LowDensity'
          DENSITY_ESTIMATION: '#/components/schemas/DensityEstimation'
    NoData:
      description: >-
        Cell outside the MNO coverage area. No population density data is returned for it.
      allOf:
        - $ref: '#/components/schemas/CellPopulationDensityData'
    LowDensity:
      description: >-
        Cell whose data is not sufficient to guarantee k-anonymity in the time interval. No population
        density data is returned for it.
      allOf:
        - $ref: '#/components/schemas/CellPopulationDensityData'
    DensityEstimation:
      description: >-
        Cell with a population density estimation, expressed in people/km2, together with the estimation
        range [minimum, maximum].
      allOf:
        - $ref: '#/components/schemas/CellPopulationDensityData'
        - type: object
          properties:
            maxPplDensity:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Maximum estimated number of people for the cell.
            minPplDensity:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Minimum estimated number of people for the cell.
            pplDensity:
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Estimated number of people for the cell.
          required:
            - maxPplDensity
            - minPplDensity
            - pplDensity
  responses:
    RetrieveLocationBadRequest400:
