openapi: 3.0.3
info:
  title: Population Density Data
  description: |
    The Population Density Data API provides estimated population density information for a specified geographic area and time interval.

    # Introduction

    The Population Density Data API allows API Consumers to retrieve anonymized estimations of the number of people per square kilometer in the given area in the time interval on an hourly basis. The resulting data is prepared by the API Provider, either derived from historical network data or using prediction algorithms. The API supports both synchronous and asynchronous processing depending on the size and complexity of the request.

    - The defined **area** is either a polygon (a list of geographical coordinates) or a list of geohashes
    - The provided **time interval** is either a fully past or a fully future time interval.
    - The resulting estimations are derived from anonymized historical device‑based information and predictive models. Returned values include the estimated population density (number of people) for each cell in the requested **area** and each hourly timeslot in the requested **time interval**, as well as an estimation density range [minimum, maximum]. The exact interpretation of minimum and maximum depends on the API Provider's underlying estimation algorithm.

    This API supports a wide range of use cases, including but not limited to:

    - **BVLOS (Beyond Visual Line of Sight) drone operations**, providing information required for SORA 2.5 intrinsic Ground Risk Class (iGRC) assessments. See [Specific Operations Risk Assessment](https://www.easa.europa.eu/en/domains/civil-drones-rpas/specific-category-civil-drones/specific-operations-risk-assessment-sora)
    - **Drone flight planning**, enabling to determine whether the ground risk class at a given time is acceptable or whether alternative times should be considered.
    - **Sustainable urban planning**, supporting analysis of population distribution patterns.
    - **Environmental and safety monitoring** during large events such as concerts, festivals, or public gatherings.

    These examples illustrate typical applications, but the API can be used in many other scenarios where population density estimation is relevant.

    # Relevant Terms and Definitions

    **Population Density**
    Number of people at a given time in a given area expressed as an integer value.

    **Area Types**
    - **POLYGON**: Area defined by a list of latitude/longitude points forming a simple polygon. The polygon is subdivided into a grid of equal-sized cells. The number of cells in the grid is dependent on the requested precision.
    - **GEOHASHLIST**: Area defined as a list of geohash strings. Geohashes may be individual, non‑contiguous geographical areas each with their own (possibly different) precision.

    **Grid Cell**
    A subdivision of the requested area.

    - For polygon areas, the API generates equal‑sized grid cells based on the requested precision, by mapping each polygon coordinate to a geohash at the requested precision level.
    - For geohash lists, each geohash corresponds to a single cell at the requested precision level.

    **Geohash**
    A geohash is a string-encoded representation of a geographical area/point on the globe. The (32-base) geohash model represents the globe as a grid of 32 fixed rectangular areas, referred to as cells. Each cell is identified by a single letter or digit. Zooming in to one cell (recursively) gives a more granular (or higher precision) 32-cell grid at the next level with each cell again identified by a single letter or digit. The geohash is a string that identifies a cell at a given zoom level by concatenating the identifiers of all previous level grid cells selected. The deeper the zoom, the longer the string and the higher the granularity/precision of the cell. The maximum zoom/precision level in this system is 12. The length (number of characters) of the geohash indicates its precision (zoom level/granularity). For examples, see [here](https://esp.info/geohash) or [here](https://www.geohash.es/encode).

    **Precision**
    Defines the granularity level of grid cells.

    - **POLYGON**: For polygon areas, the precision level 7 is used by default. I.e. a grid is generated for the polygon by creating a list of geohashes, one for each of the coordinates of the provided polygon at zoom level 7. NOTE: several very close polygon coordinates may map into the same geohash.
    - **GEOHASHLIST**: For geohash lists, each geohash’s own length determines its precision. Example: the geohash for Spain is "e" at precision level 1; the geohash for Madrid (2 cell zoom levels deeper) is "ezj" at precision level 3. Further zooming adds more characters to the geohash, each time identifying a smaller rectangular area on the globe.

    **MNO Coverage Area**
    The geographic area where the Mobile Network Operator (MNO) provides connectivity services. Cells outside this area are returned with `dataType = NO_DATA`.

    **Population Density Data API call result: DataType**
    - **DENSITY_ESTIMATION**: Population density estimation is available.
    - **LOW_DENSITY**: Insufficient anonymized data due to k‑anonymity constraints; no density estimation is returned.
    - **NO_DATA**: The cell lies outside the MNO coverage area.

    **k‑Anonymity**
    A privacy mechanism ensuring that data cannot be attributed to fewer than *k* individuals. If insufficient data exists for a cell/time interval, the API returns `LOW_DENSITY`.

    **Synchronous vs Asynchronous Processing**
    - **Synchronous**: The API returns the result immediately in the response.
    - **Asynchronous**: For large requests or when explicitly requested via `sink`, the API returns a 202 response with an `operationId` and later delivers the result to the callback URL, including the same `operationId`.

    **OperationId**
    A unique identifier correlating an asynchronous request with its callback notification.

    **Callback URL and Token**
    A callback URL (`sink`) may be provided to receive asynchronous results. When `sink` is used, the client should also provide `sinkCredential` to secure the callback endpoint. Supported credential types are `ACCESSTOKEN` and `PRIVATE_KEY_JWT`.

    # API Functionality

    To retrieve population density data, the API consumer specifies:
    1. The area (polygon or geohash list)
    2. The precision (only for polygon areas)
    3. A fully past or fully future time interval

    The API returns a sequence of hourly time slots covering the specified interval (adjusted to the begin and end full hour boundaries). Each time slot contains population density data result for all the grid cells covering the requested area.

    - For polygon areas, the API implementation subdivides the polygon into equal‑sized grid cells based on the precision requested in the API call. If not specified in the request, a default precision level 7 is used.
    - For geohash lists, each geohash corresponds to a single cell, and the `precision` property must not be included in the API call.

    Population density values are estimated using historical data, prediction models, and population estimation algorithms. The allowed time interval is constrained:
    - The minimum allowed `startTime` is up to 3 months before the request time.
    - The maximum allowed `endTime` is up to 3 months after the request time.
    - The difference between `startTime` and `endTime` must not exceed 7 days (168 hours).

    Polygon areas must meet certain constraints:
    - Maximum polygon area size (implementation‑specific).
    - Must have a minimum of 3 and can have a maximum of 15 geographical points defining the polygon.
    - Must lie at least partially within the MNO coverage area; otherwise, an empty array is returned.

    For geohash lists:
    - Support for `GEOHASHLIST` is optional for MNOs.
    - Geohashes may be non‑contiguous and have varying precision.
    - Unsupported geohash precisions result in `UNSUPPORTED_PRECISION`.
    - Geohashes outside coverage are returned with `NO_DATA`.
    - If all geohashes are outside coverage, the response status is `AREA_NOT_SUPPORTED`.

    The API normally behaves synchronously. However, large requests may trigger asynchronous processing. Clients may enforce asynchronous behavior by providing a `sink` callback URL. If asynchronous processing is not supported, the API returns `UNSUPPORTED_ASYNC_RESPONSE`.

    Three mutually exclusive `422` errors indicate why a request cannot be served:
    - **UNSUPPORTED_ASYNC_RESPONSE**: Asynchronous processing is not supported.
    - **UNSUPPORTED_SYNC_RESPONSE**: Request too large for synchronous processing and asynchronous processing is not enabled.
    - **UNSUPPORTED_REQUEST**: Request too large for both synchronous and asynchronous processing.

    If an error occurs during asynchronous processing, the callback includes `status = OPERATION_NOT_COMPLETED` and a `statusInfo` field with additional details.

    **Privacy Note**
    To ensure anonymization, if data for a cell/time interval does not meet k‑anonymity requirements, the API returns `LOW_DENSITY` for that cell.

    # Resources and Operations Overview

    The API exposes a single POST endpoint for retrieving population density data for a specified area and time interval.
    The API call result is an array of hourly timeslots (`timedPopulationDensityData`), with per timeslot an array of cells (`cellPopulationDensityData`), with for each cell the resulting `DataType` with the density data result. If data is available, the result `DataType` is **DENSITY_ESTIMATION**, and the estimated density data is a number of estimated people in the cell in the timeslot, as well as minimum and maximum estimated values. Other possible results are indicated by different DataTypes. The 3 possible results are as follows:

    - **DENSITY_ESTIMATION**: Population density estimation is available.
    - **LOW_DENSITY**: Insufficient anonymized data due to k‑anonymity constraints; no density estimation is returned.
    - **NO_DATA**: The cell lies outside the MNO coverage area.

    **Callback URL and token**
    Developers may provide a callback URL (`sink`) for receiving an asynchronous response. This is an optional parameter. If `sink` is included, it is RECOMMENDED for the client to provide as well the `sinkCredential` property to protect the notification endpoint. If provided, `sinkCredential.credentialType` MUST be set to `ACCESSTOKEN` or `PRIVATE_KEY_JWT`.

    - When an asynchronous response is requested (using `sink`), the 202 response of the API will include an `operationId` property. This `operationId` property will also be sent in the callback payload. The purpose of the `operationId` is to correlate an asynchronous response with its corresponding request.

    - Using `credentialType: PRIVATE_KEY_JWT` requires the JWT authentication parameters (a.k.a. JWK Set) to be pre-configured by an agreement between the API consumer and the API provider as part of the onboarding process. The API never returns `sinkCredential`, so the contained provider's `jwksUri` is never conveyed in the response. The `/retrieve` operation creates no resource to read back. The same static `jwksUri` is returned on every `202` response, and the callback may be delivered before the API consumer has processed that response. If `PRIVATE_KEY_JWT` is provided and no JWK Set is configured for the API consumer, the API returns the error response `422 PRIVATE_KEY_JWT_NOT_CONFIGURED`. A failure to authenticate against the API consumer's authorization server when the callback is delivered cannot be detected while the request is being processed, and is therefore reported in the callback with property `status` set to `OPERATION_NOT_COMPLETED`.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    For this API, only anonymized data is processed, and no personal data is exposed. Therefore, access is granted using the Client Credentials (2‑legged) flow.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

